<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Tank Trouble 2</title>

    <link rel="manifest" href="appmanifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" sizes="256x256" href="icon-256.png" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="shortcut icon" sizes="256x256" href="icon-256.png" />
    <link rel="icon" href="icon-32.png">

    <style type="text/css">
        * {
            padding: 0;
            margin: 0;
        }
        html, body {
            background: #000;
            color: #fff;
            overflow: hidden;
            touch-action: none;
            -ms-touch-action: none;
            width: 100%;
            height: 100%;
        }
        canvas {
            touch-action-delay: none;
            touch-action: none;
            -ms-touch-action: none;
        }
    </style>
    <link href="css/animate.min.css" rel="stylesheet" type="text/css" />

    <script>
        // Neutralize orientation lock error on desktop
        if (screen && screen.orientation && screen.orientation.lock) {
            screen.orientation.lock = function() { return Promise.resolve(); };
        }

        // Intercept defunct freegeoip.net requests cleanly
        const origOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
            if (typeof url === 'string' && url.includes('freegeoip.net')) {
                this.isFreeGeoIp = true;
            }
            return origOpen.call(this, method, url, ...rest);
        };
        const origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function(...args) {
            if (this.isFreeGeoIp) {
                Object.defineProperty(this, 'status', { value: 200, writable: false });
                Object.defineProperty(this, 'responseText', { value: JSON.stringify({ country_name: "Earth", country_code: "US" }), writable: false });
                Object.defineProperty(this, 'readyState', { value: 4, writable: false });
                setTimeout(() => {
                    if (typeof this.onload === 'function') this.onload();
                    if (typeof this.onreadystatechange === 'function') this.onreadystatechange();
                }, 10);
                return;
            }
            return origSend.apply(this, args);
        };
    </script>
</head>
<body>
    <div id="c2canvasdiv">
        <canvas id="c2canvas" width="965" height="644">
            <h1>Your browser does not appear to support HTML5.</h1>
        </canvas>
    </div>

    <script src="js/eb14e23ad0e87289c77974272595d71e7b61790f.js"></script>
    <script src="firebase.js"></script>
    <script src="js/c2runtime.js"></script>
    <script>
        jQuery(document).ready(function () {
            cr_createRuntime("c2canvas");
        });

        function onVisibilityChanged() {
            if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden) cr_setSuspended(true);
            else cr_setSuspended(false);
        }

        document.addEventListener("visibilitychange", onVisibilityChanged, false);
        document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
    </script>
</body>
</html>
